<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#0ab5c8"     stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0ab5c8"     stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="80%" r="70%">
      <stop offset="0%"   stop-color="#0e2540"/>
      <stop offset="100%" stop-color="#07101e"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>

  <!-- Geologische Schichten (Wellenlinien) -->
  <path d="M3 15 Q10 12.5 16 15 Q22 17.5 29 15" fill="none" stroke="#1a4a72" stroke-width="0.8" opacity="0.7"/>
  <path d="M3 19 Q10 16.5 16 19 Q22 21.5 29 19" fill="none" stroke="#0e2540" stroke-width="0.8" opacity="0.5"/>
  <path d="M3 23 Q10 20.5 16 23 Q22 25.5 29 23" fill="none" stroke="#112c4a" stroke-width="0.8" opacity="0.4"/>

  <!-- Bohr-Chevron (zeigt Richtung: runter = in die Erde) -->
  <path d="M9 5 L16 14 L23 5" fill="none" stroke="#0ab5c8" stroke-width="2.6"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Verbindungslinie Chevron → Wärmequelle -->
  <line x1="16" y1="14" x2="16" y2="18.5" stroke="#0ab5c8" stroke-width="1.6"
        stroke-linecap="round" opacity="0.8"/>

  <!-- Wärmequellen-Glow -->
  <circle cx="16" cy="24" r="5.5" fill="url(#glow)" opacity="0.5"/>
  <circle cx="16" cy="24" r="3"   fill="#06a0b3" opacity="0.7"/>
  <circle cx="16" cy="24" r="1.6" fill="#22d3ee"/>
</svg>